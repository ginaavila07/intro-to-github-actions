name: Build and Deploy Java War package to Azure Web App

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
 workflow_dispatch:
 
env:
  AZURE_WEBAPP_NAME: 'ghactions-app-vavila' # set the value to the name of the Azure Web App
  JAVA_VERSION: '8' # set the value to the Java version to use, e.g., '8' for JDK 8

jobs:
 ci-test:
  name: CI test
  runs-on: ubuntu-latest

  steps:
     - name: Checkout Repository
       uses: actions/checkout@v7
 
     - name: Set Up JDK
       uses: actions/setup-java@v5
       with:
        distribution: zulu
        java-version: ${{ env.JAVA_VERSION }}

     - name: Run Tests
       run: mvn test

 build-and-deploy:
  name: Build and Deploy
  runs-on: ubuntu-latest
  needs: ci-test

  steps:
   - name: Checkout Repository
     uses: actions/checkout@v7

   - name: Set Up JDK
     uses: actions/setup-java@v5
     with:
      distribution: zulu
      java-version: ${{ env.JAVA_VERSION }}

   - name: Build with Maven
     run: mvn package


   - name: Change Warfile Name
     run: mv ${{ github.workspace }}/target/*.war ${{ github.workspace }}/target/ROOT.war

   - name: Deploy to Azure WebApp
     uses: Azure/webapps-deploy@v2.2.19
     with:
      app-name: ${{ env.AZURE_WEBAPP_NAME }}
      publish-profile: ${{ secrets.AZURE_WEB_APP_PUBLISH_PROFILE }}# optional
      package: ${{ github.workspace }}/target/ROOT.war

    
