name: Test

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
 workflow_dispatch:

jobs:
 ci-test:
  name: CI test
  runs-on: ubuntu-latest

  steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set Up JDK
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: '8'

  - name: Run Tests
    run: mvn test

